name: Build APK
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: versionName (e.g. 1.0.8.5)
        default: 1.0.8.5
      flavor:
        description: arm64 or x64
        default: arm64
      app_id_suffix:
        description: 'applicationId 后缀，例如 .dev（留空 = 默认包名）'
        default: ''
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Patch applicationId
        if: inputs.app_id_suffix != ''
        run: |
          sed -i 's|applicationId = "io.github.ccch1mneyyy.dsh_app"|applicationId = "io.github.ccch1mneyyy.dsh_app${{ inputs.app_id_suffix }}"|' app/android/app/build.gradle.kts
          grep -n 'applicationId' app/android/app/build.gradle.kts | head -3
      - name: Keys
        run: |
          mkdir -p app/android/keys
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/keys/dshgo.jks
          cat > app/android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/app/android/keys/dshgo.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Pub get
        run: cd app && flutter pub get
      - name: Build
        run: |
          cd app
          BN=$(date +%-m%d%H%M)
          echo "versionCode=$BN"
          flutter build apk --release --flavor ${{ inputs.flavor }} \
            --target-platform "android-${{ inputs.flavor }}" \
            --build-name "${{ inputs.version_name }}" \
            --build-number "$BN" \
            --dart-define="DSH_APP_VERSION=${{ inputs.version_name }}+$BN"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-${{ inputs.version_name }}-${{ inputs.flavor }}${{ inputs.app_id_suffix }}
          path: app/build/app/outputs/flutter-apk/*.apk
