name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: build
        run: |
          # 打包阶段（packageArm64Release）在 2.5G 堆上会 OOM 且不打印原因，CI 上给 4G
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError\norg.gradle.logging.stacktrace=all\n' >> android/gradle.properties
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
