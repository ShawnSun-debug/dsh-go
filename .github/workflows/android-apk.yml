name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: free disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: build
        run: |
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError\norg.gradle.logging.stacktrace=all\n' >> android/gradle.properties
          set +e
          flutter build apk --release --target-platform android-arm64 2>&1 | tail -60
          echo "flutter exit: $?"
          echo '--- 产出的 apk ---'
          find . -name '*.apk' -not -path '*/intermediates/*' | tee /tmp/apks.txt
          test -s /tmp/apks.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk
          path: app/build/**/*.apk
          if-no-files-found: error
